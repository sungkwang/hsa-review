[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-orders-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Amazon.com personal order history and transactions"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sean Oliver" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "truststore>=0.9; sys_platform == \"win32\"",
    "pydantic>=2.0.0",
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/seanoliver/amazon-orders-mcp"
Repository = "https://github.com/seanoliver/amazon-orders-mcp"
Issues = "https://github.com/seanoliver/amazon-orders-mcp/issues"

[project.scripts]
amazon-orders-mcp = "amazon_orders_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
